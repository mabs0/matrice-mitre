<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MAPTRIX — Diagnostic de maturité cyber sur MITRE ATT&amp;CK</title>
    <meta name="description" content="Outil de diagnostic de la maturité cyber d'une organisation, fondé sur les mesures d'atténuation du framework MITRE ATT&amp;CK Enterprise.">

    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="css/matrix.css">
    <link rel="stylesheet" href="css/quiz.css">

    <script>
    /*
        Apparie feuilles de style et modules au document qui les demande.

        GitHub Pages sert les fichiers avec une durée de vie courte mais non
        nulle. Un navigateur peut donc très bien avoir le HTML et les scripts
        d'une publication, et le CSS de la précédente : les sélecteurs récents
        n'existent pas, des blocs entiers se retrouvent sans mise en forme, et
        rien ne le signale — aucune erreur, aucune trace en console. C'est
        arrivé, l'accueil s'affichait en pièces détachées sur mobile.

        Le jeton est la date de dernière modification du document lui-même. Elle
        change à chaque publication, et c'est celle de la copie effectivement
        servie : quand le HTML vient du cache, le CSS d'époque est redemandé
        avec lui, et les deux restent cohérents. Entre deux publications le
        jeton ne bouge pas, donc le cache continue de faire son travail.

        Mesuré sur GitHub Pages : tous les fichiers d'une publication portent la
        même date — celle du déploiement, pas celle du commit du fichier. Le
        jeton bouge donc même quand seul le CSS a changé.

        À défaut d'en-tête `Last-Modified`, `document.lastModified` vaut l'heure
        courante : on retombe alors sur un rechargement à chaque visite, ce qui
        est le comportement sûr.

        Le graphe de modules est versionné par une carte d'imports, et non en
        collant un jeton sur `main.js` : les spécificateurs relatifs de ses
        imports ne l'héritent pas, on rechargerait le point d'entrée en laissant
        ses dépendances en cache. C'est-à-dire le défaut d'origine à l'envers —
        et il a été observé : du CSS neuf sur un markup ancien. Une carte
        d'imports agit sur tout le graphe d'un coup ; la liste ci-dessous est
        tenue à jour par une assertion du banc, qui la compare au contenu de
        `js/`.
    */
    (function () {
        // En file:// rien ne se chargera de toute façon : on laisse le
        // diagnostic ci-dessous s'expliquer sur une page correctement mise en forme.
        if (location.protocol === "file:") return;

        var stamp = document.lastModified.replace(/\D/g, "");

        var links = document.querySelectorAll('link[rel="stylesheet"]');
        for (var i = 0; i < links.length; i++) {
            links[i].href = links[i].getAttribute("href").split("?")[0] + "?v=" + stamp;
        }

        // Une carte d'imports demande Chrome 89, Safari 16.4, Firefox 108. Sur
        // plus ancien, la carte serait ignorée et les modules resteraient
        // introuvables : l'application ne démarrerait pas du tout. Mieux vaut
        // alors charger sans jeton — c'est-à-dire risquer une version en cache
        // plutôt qu'une page morte.
        var carteSupportee = typeof HTMLScriptElement !== "undefined"
            && typeof HTMLScriptElement.supports === "function"
            && HTMLScriptElement.supports("importmap");

        var modules = [
            "attack", "catalog", "excel", "io", "layer", "main", "scoring",
            "shared-questions", "theme", "tool-questions", "ui",
            "views/home", "views/home-visuals", "views/matrix", "views/quiz",
        ];
        // Clés et valeurs en URL absolues. Une valeur relative doit commencer
        // par « ./ » pour qu'une carte d'imports l'accepte ; sans cela elle est
        // normalisée à null et le module se retrouve bloqué, pas seulement
        // non versionné.
        if (carteSupportee) {
            var imports = {};
            for (var j = 0; j < modules.length; j++) {
                var url = new URL("js/" + modules[j] + ".js", document.baseURI).href;
                imports[url] = url + "?v=" + stamp;
            }
            var map = document.createElement("script");
            map.type = "importmap";
            map.textContent = JSON.stringify({ imports: imports });
            document.head.appendChild(map);
        }

        // La carte ne s'applique pas au `src` du script racine. Il porte son
        // jeton lui aussi — mais seulement si la carte a été posée : jetonner le
        // seul point d'entrée rechargerait celui-ci en laissant ses imports en
        // cache, soit précisément le mélange incohérent qu'on cherche à éviter.
        // Un module est différé par nature, le placer ici équivaut à le placer
        // en fin de corps.
        var entry = document.createElement("script");
        entry.type = "module";
        entry.src = carteSupportee ? "js/main.js?v=" + stamp : "js/main.js";
        document.head.appendChild(entry);
    })();
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <!--
        La bibliothèque Excel n'est pas chargée ici : elle pèse 250 Ko et ne sert
        qu'à l'export et à l'import, jamais au démarrage. `js/excel.js` l'appelle
        au premier besoin. Voir `loadExcel`.
    -->
</head>
<body>
    <!--
        La mascotte, dessinée ici et référencée partout ailleurs par <use> : elle
        sert de logo, accompagne le chargement et portera le tutoriel guidé. Ce
        tracé est original — aucune illustration extérieure n'est reprise, ce qui
        évite toute question de licence et laisse les droits entiers.

        Le conteneur n'est pas en display:none : certains navigateurs cessent de
        résoudre les <use> dont la source a un ancêtre masqué ainsi.
    -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
        <symbol id="mascot" viewBox="0 0 64 64">
            <g class="m-arms" fill="none" stroke-width="3.6" stroke-linecap="round">
                <path d="M18 33c-3 8-1 14-6.5 18"/>
                <path d="M24 35c-2 9 0 15-4.5 19"/>
                <path d="M30 36c-1 9 1 15-2 20"/>
                <path d="M34 36c1 9-1 15 2 20"/>
                <path d="M40 35c2 9 0 15 4.5 19"/>
                <path d="M46 33c3 8 1 14 6.5 18"/>
            </g>
            <path class="m-body" d="M15 36C15 14 49 14 49 36Z"/>
            <circle class="m-eye" cx="26" cy="26" r="4.7"/>
            <circle class="m-eye" cx="38" cy="26" r="4.7"/>
            <circle class="m-pupil" cx="27.2" cy="26.8" r="2.1"/>
            <circle class="m-pupil" cx="39.2" cy="26.8" r="2.1"/>
            <path class="m-mouth" d="M29 32.4q3 2.4 6 0" fill="none" stroke-width="1.8"
                  stroke-linecap="round"/>
        </symbol>
    </svg>

    <!-- Écran de chargement : les données ATT&CK sont relues à chaque visite. -->
    <div id="boot">
        <svg class="boot-mascot" viewBox="0 0 64 64" aria-hidden="true"><use href="#mascot"/></svg>
        <h1>Chargement de la matrice MITRE ATT&amp;CK</h1>
        <div class="bar" id="boot-bar"><span></span></div>
        <p class="pct" id="boot-pct"></p>
        <p class="sub" id="boot-status">Initialisation…</p>
    </div>

    <!--
        Diagnostic de démarrage. Script classique volontairement : contrairement à
        un module ES, il s'exécute même depuis file://, donc il peut expliquer
        pourquoi le reste ne démarre pas.
    -->
    <script>
    (function () {
        var boot = document.getElementById("boot");
        var showProblem = function (title, detail, fix) {
            boot.innerHTML = "<h1>" + title + "</h1>"
                + (detail ? '<p class="err">' + detail + "</p>" : "")
                + (fix ? '<p class="fix">' + fix + "</p>" : "");
        };

        if (location.protocol === "file:") {
            showProblem(
                "Il faut servir la page, pas l'ouvrir",
                "Ouvert en <code>file://</code>, le navigateur refuse de charger les modules "
                + "JavaScript de l'application : leur chargement est soumis à la politique "
                + "d'origine, et un fichier local n'a pas d'origine. Firefox comme Chrome se "
                + "comportent ainsi.",
                "Depuis le dossier du projet, lancez un serveur local puis ouvrez "
                + "<code>http://localhost:8000</code> :<br><code>python3 -m http.server 8000</code>"
                + "<br><br>C'est ce que fait l'extension Live Server de VS Code, et c'est "
                + "aussi ainsi que GitHub Pages sert le site — en ligne, rien à faire."
            );
            return;
        }

        var failure = null;
        window.addEventListener("error", function (e) {
            if (e.target && e.target.tagName === "SCRIPT") failure = "Script non chargé : " + e.target.src;
            else if (e.message) failure = e.message;
        }, true);

        // Si l'application n'a pas démarré au bout de 25 s, on affiche ce qu'on sait
        // plutôt que de laisser tourner la barre indéfiniment.
        setTimeout(function () {
            if (window.__ctrmBooted || !document.getElementById("boot")) return;
            showProblem(
                "Le démarrage n'aboutit pas",
                failure || "Aucune erreur JavaScript remontée : le transfert des données ATT&amp;CK "
                    + "est probablement encore en cours ou bloqué.",
                "Ouvrez la console du navigateur (F12) et envoyez le message d'erreur. "
                + "Vérifiez aussi qu'un filtrage réseau ne bloque pas "
                + "<code>raw.githubusercontent.com</code>."
            );
        }, 25000);
    })();
    </script>

    <header id="topbar">
        <button class="brand" id="brand" title="Retour à l'accueil">
            <svg class="brand-mascot" viewBox="0 0 64 64" aria-hidden="true"><use href="#mascot"/></svg>
            MAPTRIX
        </button>

        <div id="layer-tabs"></div>

        <span class="version-badge hidden" id="version-badge">
            <i class="dot"></i><span id="version-text"></span>
        </span>

        <!--
            Questionnaire et Exporter vivent ici plutôt que dans la barre d'outils
            de la matrice : ce sont des actions sur le layer, pas des réglages
            d'affichage. Les laisser en bout de barre d'outils la chargeait, et
            c'est elle qui passait à la ligne en premier sur un écran étroit.
            Le script de la vue matrice les remplit et les révèle.
        -->
        <div id="topbar-actions" class="hidden"></div>

        <button class="btn btn-ghost btn-icon" id="theme-toggle" title="Basculer clair / sombre"
                aria-label="Basculer entre le thème clair et le thème sombre">☀</button>
    </header>

    <main id="views" style="flex:1 1 auto;min-height:0;display:flex;flex-direction:column;">
        <section id="view-home" class="view scrollable"></section>
        <section id="view-matrix" class="view hidden"></section>
        <section id="view-quiz" class="view hidden"></section>
    </main>

    <div class="modal" id="modal"><div class="modal-panel" id="modal-panel"></div></div>
    <div id="toasts"></div>

    <!--
        Le module d'entrée est injecté par le script de l'en-tête, avec le jeton
        de publication. Il n'y a pas de balise ici : deux points d'entrée
        chargeraient l'application deux fois.
    -->
</body>
</html>
